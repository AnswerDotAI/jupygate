[build-system]
requires = ["maturin>=1.13,<2.0", "fastws-cli>=0.0.39"]
build-backend = "fastws.build_backend"

[project]
name = "jupygate"
dynamic = ["version"]
description = "Jupyter kernel and terminal gateway with an MCP server, as a single binary"
license = "Apache-2.0"
requires-python = ">=3.11"
readme = "README.md"
authors = [{name = "Jeremy Howard"}]
maintainers = [{name = "fast.ai", email = "infos@fast.ai"}]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = ["ipymini>=0.1.26"]

[project.optional-dependencies]
dev = [
    "fastws-cli>=0.0.39",
    "pytest>=7.4",
    "pytest-asyncio",
    "pytest-timeout",
    "pytest-xdist",
    "httpx>=0.27",
    "websockets>=13",
    "jupyter-client",
    "ipykernel",
    "jupywire>=0.1.15",
    "jupyasyncclient>=0.2.32",
]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/jupygate"
Repository = "https://github.com/AnswerDotAI/jupygate"
Issues = "https://github.com/AnswerDotAI/jupygate/issues"

Documentation = "https://AnswerDotAI.github.io/jupygate/"
[tool.maturin]
bindings = "bin"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }]

[tool.fastship]
branch = "main"
