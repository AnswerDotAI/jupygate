[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jupygate"
dynamic = ["version"]
description = "Websocket gateway for Jupyter kernels"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "pyzmq>=26",
  "jupywire>=0.0.1",
  "fastcore>=2.1.17",
  "starlette>=1.0",
  "uvicorn>=0.30",
  "ptymini>=0.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-timeout",
  "ipymini>=0.1.17",
  "httpx>=0.27",
  "websockets>=13",
]

[project.scripts]
jupygate = "jupygate.core:main"

[project.urls]
Repository = "https://github.com/AnswerDotAI/jupygate"
Documentation = "https://AnswerDotAI.github.io/jupygate/"

[project.entry-points.nbdev]
jupygate = "jupygate._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "jupygate.__version__"}

[tool.setuptools.packages.find]
include = ["jupygate"]

[tool.nbdev]
