[package]
name = "jupygate"
version = "0.1.4"
edition = "2024"
description = "Jupyter kernel and terminal gateway with an MCP server, as a single static binary"
license = "Apache-2.0"
repository = "https://github.com/AnswerDotAI/jupygate"
readme = "README.md"

[lib]
doctest = false
test = false

[[bin]]
name = "jupygate"
path = "src/main.rs"
test = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
aihist = { version = "0.1.11", default-features = false }
kernmini = ">=0.1.24, <1"
nix = { version = "0.30", features = ["signal"] }
ptymini = ">=0.0.9, <1"
rcgen = { version = "0.13", default-features = false, features = ["pem", "crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "net", "process", "io-util", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
zmtpmini = "0.1.8"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
libc = "0.2"

[profile.test]
inherits = "release"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.jupygate]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
strip = true

[profile.dist.package.jupygate]
incremental = false
